<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${alquiler.id != null ? 'Editar Alquiler' : 'Nuevo Alquiler'}">Alquiler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-calendar-alt"></i>
                            <span th:text="${alquiler.id != null ? 'Editar Alquiler' : 'Nuevo Alquiler'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/alquileres}" th:object="${alquiler}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha Inicio *</label>
                                    <input type="date" class="form-control" th:field="*{fechaInicio}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha Fin *</label>
                                    <input type="date" class="form-control" th:field="*{fechaFin}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Cliente ID *</label>
                                    <input type="number" class="form-control" th:field="*{clienteId}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Propiedad ID *</label>
                                    <input type="number" class="form-control" th:field="*{propiedadesId}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio *</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
                                </div>
                                <div class="col-md-6 mb-3 d-flex align-items-end">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" th:field="*{activo}" id="activo">
                                        <label class="form-check-label" for="activo">Activo</label>
                                    </div>
                                </div>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/alquileres}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
