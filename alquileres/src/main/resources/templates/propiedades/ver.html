<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${propiedad.titulo}">Propiedad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-building"></i>
                            <span th:text="${propiedad.titulo}"></span>
                        </h4>
                    </div>
                    <div class="card-body">

                        <div class="mb-4">
                            <label class="form-label fw-bold">Imagen</label>
                            <img th:src="${propiedad.imagenUrl}" class="img-fluid rounded"
                                style="max-height: 400px; width: 100%; object-fit: cover;"
                                onerror="this.onerror=null; this.src='/img/propiedades/default.jpg'">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Título</label>
                            <p class="form-control-plaintext" th:text="${propiedad.titulo}"></p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <p class="form-control-plaintext" th:text="${propiedad.descripcion}"></p>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-bold">Dirección</label>
                                <p class="form-control-plaintext" th:text="${propiedad.direccion}"></p>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Ciudad</label>
                                <p class="form-control-plaintext" th:text="${propiedad.ciudad}"></p>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Precio Alquiler ($/noche)</label>
                                <p class="form-control-plaintext" th:text="'$ ' + ${propiedad.precioAlquiler}"></p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Disponible</label>
                                <p class="form-control-plaintext">
                                    <span th:if="${propiedad.disponible}" class="badge bg-success">Sí, disponible</span>
                                    <span th:unless="${propiedad.disponible}" class="badge bg-danger">No
                                        disponible</span>
                                </p>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/propiedades}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
