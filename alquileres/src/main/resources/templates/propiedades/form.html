<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${id != null ? 'Editar Propiedad' : 'Nueva Propiedad'}">Propiedad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-building"></i>
                            <span th:text="${id != null ? 'Editar Propiedad' : 'Nueva Propiedad'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${id != null ? '/propiedades/actualizar/' + id : '/propiedades'}"
                              th:object="${propiedad}" method="post" enctype="multipart/form-data">

                            <div class="mb-3">
                                <label class="form-label">Título *</label>
                                <input type="text" class="form-control" th:field="*{titulo}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción *</label>
                                <textarea class="form-control" th:field="*{descripcion}" rows="3" required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label">Dirección *</label>
                                    <input type="text" class="form-control" th:field="*{direccion}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Ciudad *</label>
                                    <input type="text" class="form-control" th:field="*{ciudad}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio Alquiler ($/noche) *</label>
                                    <input type="number" step="0.01" class="form-control"
                                           th:field="*{precioAlquiler}" min="0" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Disponible</label>
                                    <select class="form-select" th:field="*{disponible}">
                                        <option th:value="true">Sí</option>
                                        <option th:value="false">No</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">URL de Imagen</label>
                                <input type="text" class="form-control" th:field="*{imagenUrl}"
                                       placeholder="/img/propiedades/default.jpg">
                                <small class="text-muted">Ruta relativa o URL de la imagen</small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Imagen</label>
                                <input type="file" class="form-control" name="imagenFile" accept="image/*">
                                <small class="text-muted">Sube una imagen o deja el campo de URL si ya tienes una ruta.</small>
                            </div>

                            <div class="mb-3" th:if="${propiedad.imagenUrl}">
                                <label class="form-label">Imagen actual</label>
                                <img th:src="${propiedad.imagenUrl}" class="img-fluid rounded"
                                     style="max-height: 220px; display: block;"
                                     onerror="this.src='/img/propiedades/default.jpg'"/>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/propiedades}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
